  <style>
    .app-boot-loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      box-sizing: border-box;
      color: #526072;
      background: #f4f6f9;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      font-size: 15px;
    }

    .app-boot-loading__spinner {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      box-sizing: border-box;
      border: 2px solid #c6d0dd;
      border-top-color: #4f6ff2;
      border-radius: 50%;
      animation: app-boot-spin 0.8s linear infinite;
    }

    .app-boot-loading p {
      margin: 0;
    }

    @keyframes app-boot-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-color-scheme: dark) {
      .app-boot-loading {
        color: #bdc7d5;
        background: #151a22;
      }

      .app-boot-loading__spinner {
        border-color: #465164;
        border-top-color: #8fa5ff;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .app-boot-loading__spinner {
        animation: none;
      }
    }
  </style>
  <title>保存站有题</title>
</head>

<body>
  <div id="app">
    <div class="app-boot-loading" role="status" aria-live="polite">
      <span class="app-boot-loading__spinner" aria-hidden="true"></span>
      <p>正在加载中，请勿关闭页面。初次加载速度较慢，待加载完成后静态文件被缓存在本地，访问速度会明显提升。</p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
